<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>태연 — 라이브</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --plum-deep:#1c1220; --plum-mid:#2c1d33; --violet:#4a2f52; --gold:#cf9b4e; --gold-soft:#e8c78a; --rose:#c07b7f; --cream:#f1e7dc; --cream-dim:#b7a99a; --live:#7fbf8f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:radial-gradient(ellipse at 50% -10%,var(--plum-mid),var(--plum-deep) 60%); color:var(--cream); font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; overscroll-behavior:none; }
  .hidden { display:none !important; }
  #app { max-width:480px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { padding:24px 24px 12px; text-align:center; border-bottom:1px solid rgba(232,199,138,.12); }
  header .eyebrow { font-size:12px; color:var(--cream-dim); margin:0 0 6px; }
  header h1 { font-family:'Noto Serif KR',serif; font-size:22px; font-weight:600; margin:0; color:var(--gold-soft); }
  #meta { font-size:11px; color:var(--cream-dim); opacity:.8; margin-top:8px; line-height:1.5; }
  #log { flex:1; min-height:0; overflow-y:auto; padding:20px 20px 8px; display:flex; flex-direction:column; gap:12px; }
  #log:empty::before { content:attr(data-empty); text-align:center; color:var(--cream-dim); font-size:14px; margin-top:40px; }
  .row { display:flex; flex-direction:column; max-width:82%; }
  .row.user { align-self:flex-end; align-items:flex-end; } .row.ai { align-self:flex-start; }
  .bubble { padding:11px 15px; border-radius:16px; font-size:15px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .bubble.taeyeon { background:var(--violet); border-bottom-left-radius:4px; }
  .bubble.me { background:rgba(207,155,78,.16); border:1px solid rgba(207,155,78,.3); border-bottom-right-radius:4px; color:var(--gold-soft); }
  .bubble.interim { opacity:.6; }
  .bubble.system { align-self:center; background:none; color:var(--cream-dim); font-size:12.5px; padding:4px 10px; text-align:center; }
  .bubble.system.err { color:var(--rose); }

  #deck { padding:16px 24px calc(26px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:12px; border-top:1px solid rgba(232,199,138,.12); }
  #status { font-size:13px; color:var(--cream-dim); min-height:18px; display:flex; align-items:center; gap:6px; }
  #status .dot { width:7px; height:7px; border-radius:50%; background:var(--cream-dim); }
  #status.live .dot { background:var(--live); box-shadow:0 0 8px var(--live); }
  #status.connecting .dot { background:var(--gold-soft); animation:pulse 1.1s infinite; }
  #status.talking .dot { background:var(--rose); box-shadow:0 0 8px var(--rose); animation:pulse .8s infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
  .iconBtn { width:26px; height:26px; border-radius:50%; border:none; background:transparent; color:var(--cream-dim); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; }
  .iconBtn svg { width:16px; height:16px; } .iconBtn.on { color:var(--gold-soft); background:rgba(232,199,138,.12); }
  .iconBtn[hidden] { display:none; }

  #orb-wrap { position:relative; width:108px; height:108px; }
  #orb { width:100%; height:100%; border-radius:50%; border:none; cursor:pointer; background:radial-gradient(circle at 38% 32%,#5a3a63,var(--plum-mid) 70%); box-shadow:0 0 0 1px rgba(232,199,138,.25),0 10px 30px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; transition:transform .15s,box-shadow .2s; }
  #orb:active { transform:scale(.96); } #orb:disabled { opacity:.55; }
  #orb.on { background:radial-gradient(circle at 38% 32%,var(--gold-soft),var(--gold) 60%,#7a4f2e); box-shadow:0 0 0 1px rgba(232,199,138,.5),0 0 40px rgba(207,155,78,.45); }
  #orb svg { width:34px; height:34px; color:#e8c78a; } #orb.on svg { color:#2a1a10; }
  #orb-ring { position:absolute; inset:-10px; border-radius:50%; border:1px solid rgba(232,199,138,.4); opacity:0; pointer-events:none; transform:scale(1); transition:transform .08s linear,opacity .15s; }
  #hint { font-size:12px; color:var(--cream-dim); text-align:center; }
  #textRow { display:flex; align-items:center; gap:8px; width:100%; }
  #textInput { flex:1; min-width:0; padding:11px 16px; border-radius:999px; border:1px solid rgba(232,199,138,.25); background:rgba(0,0,0,.25); color:var(--cream); font-size:14px; font-family:inherit; outline:none; }
  #textInput:focus { border-color:var(--gold); } #textInput:disabled { opacity:.5; }
  .roundBtn { flex:0 0 auto; width:40px; height:40px; border-radius:50%; border:none; background:var(--gold); color:#2a1a10; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .roundBtn:disabled { opacity:.35; } .roundBtn svg { width:18px; height:18px; }
  .roundBtn.ghost { background:rgba(232,199,138,.1); border:1px solid rgba(232,199,138,.3); color:var(--gold-soft); font-size:15px; }

  #setup { position:fixed; inset:0; background:rgba(12,7,14,.92); display:flex; align-items:center; justify-content:center; padding:24px; z-index:10; }
  #setup .card { background:var(--plum-mid); border:1px solid rgba(232,199,138,.18); border-radius:18px; padding:26px 22px; max-width:380px; width:100%; }
  #setup h2 { font-family:'Noto Serif KR',serif; font-size:18px; margin:0 0 8px; color:var(--gold-soft); }
  #setup p { font-size:13px; line-height:1.6; color:var(--cream-dim); margin:0 0 16px; }
  #startBtn { width:100%; padding:12px; border-radius:10px; border:none; background:var(--gold); color:#2a1a10; font-weight:600; font-size:14px; cursor:pointer; }
  #startBtn:disabled { opacity:.5; }
  #setup .warn { font-size:11.5px; color:var(--rose); margin-top:10px; }
  #googleBtnWrap { display:flex; justify-content:center; margin-bottom:4px; }
</style>
</head>
<body>
<div id="app">
  <div id="setup"><div class="card">
    <h2>시작하기 전에</h2>
    <p id="setupText">불러오는 중…</p>
    <div id="googleBtnWrap" class="hidden"></div>
    <button id="startBtn" style="display:none">입장하기</button>
    <div class="warn" id="setupWarn" style="display:none"></div>
  </div></div>

  <header>
    <p class="eyebrow" id="personaTagline"></p>
    <h1 id="title">태연</h1>
    <div id="meta">라이브 모드 · 실시간 음성 대화</div>
  </header>

  <div id="log" data-empty="아래 버튼을 눌러 연결하면 바로 대화할 수 있어요"></div>

  <div id="deck">
    <div id="status"><span class="dot"></span><span id="statusText">연결 대기 중</span>
      <button id="micBtn" class="iconBtn on" type="button" title="마이크 켜기 (기본은 꺼짐)" aria-label="마이크">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
      </button>
      <button id="spkBtn" class="iconBtn on" type="button" title="목소리 켜기/끄기" aria-label="스피커">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 7 9 12 4 12 20 7 15 3 15 3 9"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.3 6a9 9 0 0 1 0 12"/></svg>
      </button>
      <button id="robotBtn" class="iconBtn on" type="button" title="스택찬 장비로 말하기" aria-label="장비" style="font-size:13px;line-height:1">🤖</button>
    </div>
    <div id="orb-wrap">
      <button id="orb" disabled aria-label="연결 / 종료">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      </button>
      <div id="orb-ring"></div>
    </div>
    <div id="hint">누르면 연결돼요</div>
    <div id="textRow">
      <button id="helloBtn" class="roundBtn ghost" type="button" disabled title="안부 묻기" aria-label="안부">💬</button>
      <input id="textInput" type="text" enterkeyhint="send" placeholder="연결 후 글로 말해도 돼요…" disabled autocomplete="off">
      <button id="sendBtn" class="roundBtn" disabled aria-label="보내기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
  </div>
</div>
<script>
(() => {
  'use strict';
  // ----- 설정 -----
  //  ?ws=wss://...        : 라이브 WebSocket 주소를 직접 지정 (기본: 같은 서버의 /api/live)
  //  ?key=API키&model=... : 서버 없이 Gemini Live에 바로 붙는 테스트용 (키가 주소창에 남으니 개인 테스트에만)
  const Q = new URLSearchParams(location.search);
  const AUTH_TOKEN_KEY = 'taeyeon_auth_token';   // 파이프 화면과 같은 키 -> 로그인 공유
  const SPK_KEY = 'taeyeon_voice_muted';         // 파이프 화면과 같은 키 -> 음소거 공유
  const IN_RATE = 16000, OUT_RATE = 24000, CHUNK = 1600;   // 입력 16kHz PCM16 (100ms씩), 출력 24kHz PCM16
  const GEMINI_WS = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent';
  const DIRECT_KEY = (Q.get('key') || '').trim();
  const DIRECT_MODEL = (Q.get('model') || 'models/gemini-2.5-flash-native-audio-preview-09-2025').trim();

  const $ = (id) => document.getElementById(id);
  const setup = $('setup'), setupText = $('setupText'), setupWarn = $('setupWarn'), startBtn = $('startBtn'), googleBtnWrap = $('googleBtnWrap');
  const logEl = $('log'), txt = $('textInput'), sendBtn = $('sendBtn'), helloBtn = $('helloBtn'), orb = $('orb'), ring = $('orb-ring');
  const statusEl = $('status'), statusText = $('statusText'), micBtn = $('micBtn'), spkBtn = $('spkBtn');

  let robotSpeak = true; try { robotSpeak = localStorage.getItem('robotSpeak') !== '0'; } catch (_) {}   // 파이프 화면과 같은 키
  let robotOK = false, rTurn = null, robotWarned = false;
  let authToken = null; try { authToken = localStorage.getItem(AUTH_TOKEN_KEY); } catch (_) {}
  let googleClientId = '', personaName = '태연';
  let spkOff = false; try { spkOff = localStorage.getItem(SPK_KEY) === '1'; } catch (_) {}
  let micOn = false;   // 기본은 마이크 없이 글자로만 대화 (🎙 버튼을 켜면 그때 권한을 묻고 말하기도 가능)
  let ws = null, state = 'idle';   // idle | connecting | live
  let sessionOpen = false, ready = false, talking = false;
  const authHeaders = () => (authToken ? { Authorization: 'Bearer ' + authToken } : {});

  // ----- 로그 UI -----
  const scrollDown = () => { logEl.scrollTop = logEl.scrollHeight; };
  function addSys(text, err) { const d = document.createElement('div'); d.className = 'bubble system' + (err ? ' err' : ''); d.textContent = text; logEl.appendChild(d); scrollDown(); }
  function addBubble(who) {
    const row = document.createElement('div'); row.className = 'row ' + who;
    const b = document.createElement('div'); b.className = 'bubble ' + (who === 'user' ? 'me' : 'taeyeon') + ' interim';
    row.appendChild(b); logEl.appendChild(row); return b;
  }
  // 한 턴 동안 말풍선을 이어 붙인다 (transcription 조각이 계속 들어옴)
  let curUser = null, curAi = null;
  const stripTags = (t) => t.replace(/\[[^\[\]]{1,30}\]/g, ' ').replace(/[ \t]{2,}/g, ' ').trimStart();
  function feed(who, text) {
    if (!text) return;
    if (who === 'user') { if (!curUser) curUser = addBubble('user'); curUser.textContent += text; }
    else {
      if (curUser) { curUser.classList.remove('interim'); curUser = null; }
      if (!curAi) curAi = addBubble('ai');
      curAi._raw = (curAi._raw || '') + text; curAi.textContent = stripTags(curAi._raw);
    }
    scrollDown();
  }
  function endTurn() { [curUser, curAi].forEach((b) => b && b.classList.remove('interim')); curUser = curAi = null; }

  function applyPersona(name, tagline) {
    personaName = String(name || '').trim() || '태연';
    $('title').textContent = personaName; document.title = personaName + ' — 라이브';
    const tg = $('personaTagline'); const tag = String(tagline || '').trim() || (personaName === '태연' ? '연남동, 작은 타로샵' : '');
    tg.textContent = tag; tg.style.display = tag ? '' : 'none';
  }
  function applyIcons() {
    micBtn.classList.toggle('on', micOn); spkBtn.classList.toggle('on', !spkOff);
    spkBtn.style.opacity = spkOff ? .45 : 1; micBtn.style.opacity = micOn ? 1 : .45;
    $('robotBtn').classList.toggle('on', robotSpeak); $('robotBtn').style.opacity = robotSpeak ? 1 : .4;
  }
  function updateStatus() {
    let cls = '', text = '연결 대기 중';
    if (state === 'connecting') { cls = 'connecting'; text = '연결하는 중…'; }
    else if (state === 'live') { cls = talking ? 'talking' : 'live'; text = talking ? personaName + ' 말하는 중 · 끼어들어도 돼요' : (micOn ? '듣고 있어요 · 말해보세요' : '연결됨 · 글로 말해보세요'); }
    else if (sessionOpen) text = '대기 중 · 눌러서 연결';
    statusEl.className = cls; statusText.textContent = text;
    orb.classList.toggle('on', state === 'live');
    orb.disabled = !sessionOpen || state === 'connecting';
    const can = state === 'live' && ready;
    txt.disabled = sendBtn.disabled = helloBtn.disabled = !can;
    $('hint').textContent = state === 'live' ? '다시 누르면 연결을 끊어요' : '누르면 연결돼요 · 마이크 없이 글로 대화해요 (🎙 버튼을 켜면 말도 가능)';
  }

  // ----- 로그인 (파이프 화면과 동일) -----
  function requireLogin(message) {
    authToken = null; try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (_) {}
    disconnect(true); sessionOpen = false; setup.classList.remove('hidden'); startBtn.style.display = 'none';
    setupText.textContent = message || '구글 계정으로 로그인해야 입장할 수 있어요.'; renderGoogleButton(); updateStatus();
  }
  function renderGoogleButton() {
    if (!googleClientId || !window.google || !google.accounts || !google.accounts.id) { setTimeout(renderGoogleButton, 300); return; }
    googleBtnWrap.classList.remove('hidden'); googleBtnWrap.innerHTML = '';
    google.accounts.id.initialize({ client_id: googleClientId, callback: onGoogleCredential });
    google.accounts.id.renderButton(googleBtnWrap, { theme: 'filled_black', size: 'large', shape: 'pill', text: 'continue_with', locale: 'ko' });
  }
  async function onGoogleCredential(resp) {
    googleBtnWrap.classList.add('hidden'); setupText.textContent = '로그인 확인 중…';
    try {
      const res = await fetch('/api/auth/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.sessionToken) { setupText.textContent = '허용되지 않은 구글 계정이에요.'; renderGoogleButton(); return; }
      authToken = data.sessionToken; try { localStorage.setItem(AUTH_TOKEN_KEY, authToken); } catch (_) {}
      showStart();
    } catch (_) { setupText.textContent = '로그인 확인에 실패했어요. 네트워크를 확인해주세요.'; renderGoogleButton(); }
  }
  function showStart() { googleBtnWrap.classList.add('hidden'); setupText.textContent = personaName + '과 실시간으로 이야기해요. (마이크 없이 글자로 대화해요)'; startBtn.style.display = 'inline-block'; startBtn.disabled = false; }
  async function init() {
    let authRequired = false;
    try { const d = await (await fetch('/api/config')).json(); authRequired = !!d.authRequired; googleClientId = d.googleClientId || ''; applyPersona(d.personaName, d.personaTagline); } catch (_) {}
    if (DIRECT_KEY || !authRequired || authToken) { showStart(); return; }
    requireLogin();
  }

  // ----- 오디오 출력 (24kHz PCM16 스트림을 이어 붙여 재생) -----
  let outCtx = null, outGain = null, playHead = 0, analyser = null;
  const sources = new Set();
  function ensureOut() {
    if (!outCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      try { outCtx = new AC({ sampleRate: OUT_RATE }); } catch (_) { outCtx = new AC(); }
      outGain = outCtx.createGain(); outGain.gain.value = spkOff ? 0 : 1;
      analyser = outCtx.createAnalyser(); analyser.fftSize = 256;
      outGain.connect(analyser); analyser.connect(outCtx.destination);
    }
    if (outCtx.state === 'suspended') outCtx.resume();
  }
  function playPcm(int16) {
    if (!outCtx || !int16.length) return;
    const f = new Float32Array(int16.length); for (let i = 0; i < f.length; i++) f[i] = int16[i] / 32768;
    const buf = outCtx.createBuffer(1, f.length, OUT_RATE); buf.copyToChannel(f, 0);
    const s = outCtx.createBufferSource(); s.buffer = buf; s.connect(outGain); sources.add(s);
    s.onended = () => { sources.delete(s); if (!sources.size) { talking = false; updateStatus(); } };
    const now = outCtx.currentTime; if (playHead < now) playHead = now + 0.04;
    s.start(playHead); playHead += buf.duration;
    if (!talking) { talking = true; updateStatus(); }
  }
  function stopPlayback() {   // 끼어들기: 재생 중인 남은 소리를 모두 버린다
    sources.forEach((s) => { try { s.stop(); } catch (_) {} }); sources.clear();
    playHead = outCtx ? outCtx.currentTime : 0; talking = false; updateStatus();
  }
  const b64ToInt16 = (b64) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Int16Array(u.buffer, 0, u.length >> 1); };

  // ----- 마이크 입력 (AudioWorklet -> 16kHz PCM16, 100ms씩 전송) -----
  let mic = null;
  const WORKLET = 'class P extends AudioWorkletProcessor{process(i){const c=i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor("pcm-tap",P)';
  async function startMic() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
    await ac.audioWorklet.addModule(url); URL.revokeObjectURL(url);
    const node = new AudioWorkletNode(ac, 'pcm-tap');
    const ratio = ac.sampleRate / IN_RATE; let carry = new Float32Array(0), pos = 0, level = 0;
    node.port.onmessage = (e) => {
      const f = e.data; let peak = 0; for (let i = 0; i < f.length; i += 8) peak = Math.max(peak, Math.abs(f[i])); level = peak;
      if (!micOn || !ready || !ws || ws.readyState !== 1) return;
      const merged = new Float32Array(carry.length + f.length); merged.set(carry); merged.set(f, carry.length);
      const out = []; let p = pos;
      while (p + ratio <= merged.length) {            // 평균내기식 다운샘플링
        let sum = 0, c = 0; for (let j = Math.floor(p); j < Math.floor(p + ratio); j++) { sum += merged[j]; c++; }
        out.push(c ? sum / c : 0); p += ratio;
      }
      carry = merged.subarray(Math.floor(p)); pos = p - Math.floor(p); carry = new Float32Array(carry);
      if (!out.length) return;
      mic.pend.push(...out);
      while (mic.pend.length >= CHUNK) sendAudio(mic.pend.splice(0, CHUNK));
    };
    src.connect(node);
    mic = { stream, ac, src, node, pend: [], get level() { return level; } };
  }
  function sendAudio(samples) {
    const i16 = new Int16Array(samples.length);
    for (let i = 0; i < samples.length; i++) { const s = Math.max(-1, Math.min(1, samples[i])); i16[i] = s < 0 ? s * 32768 : s * 32767; }
    const u = new Uint8Array(i16.buffer); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    wsSend({ realtimeInput: { audio: { data: btoa(bin), mimeType: 'audio/pcm;rate=' + IN_RATE } } });
  }
  function stopMic() {
    if (!mic) return; const m = mic; mic = null;
    try { m.node.disconnect(); m.src.disconnect(); } catch (_) {}
    m.stream.getTracks().forEach((t) => t.stop()); try { m.ac.close(); } catch (_) {}
  }

  // 말하는 소리 크기에 맞춰 오브 링이 숨쉬듯 커진다 (내 목소리 또는 태연 목소리 중 큰 쪽)
  const fbuf = new Uint8Array(128);
  (function meter() {
    let lv = mic && micOn ? Math.min(1, mic.level * 3) : 0;
    if (analyser && talking) { analyser.getByteTimeDomainData(fbuf); let pk = 0; for (let i = 0; i < fbuf.length; i++) pk = Math.max(pk, Math.abs(fbuf[i] - 128) / 128); lv = Math.max(lv, Math.min(1, pk * 2.2)); }
    if (state === 'live') { ring.style.opacity = 0.25 + lv * 0.6; ring.style.transform = 'scale(' + (1 + lv * 0.35) + ')'; } else ring.style.opacity = 0;
    requestAnimationFrame(meter);
  })();

  // ----- 장비(스택찬)로 말하기: 태연의 대답 자막을 /xiaozhi/say로 보내 장비가 읽게 한다 (장비가 읽는 동안 이 화면은 조용) -----
  async function refreshRobot(announce) {
    robotOK = false; let why = '';
    if (!robotSpeak || spkOff) { if (announce && robotSpeak && spkOff) addSys('목소리가 꺼져 있어서 장비로도 안 보내요.'); return; }
    const ctl = new AbortController(), tm = setTimeout(() => { try { ctl.abort(); } catch (_) {} }, 4000);
    try {
      const r = await fetch('/xiaozhi/status', { headers: authHeaders(), signal: ctl.signal });
      if (r.status === 401) { requireLogin('로그인이 만료됐어요. 다시 로그인해주세요.'); return; }
      if (!r.ok) why = '장비 상태 확인 실패 HTTP ' + r.status;
      else { const j = await r.json(); robotOK = !!j.connected && !j.busy; why = j.connected ? (j.busy ? '장비가 아직 말하는 중이라' : '') : '장비가 서버에 연결돼 있지 않아서'; }
    } catch (_) { why = '장비 상태를 확인하지 못해서'; } finally { clearTimeout(tm); }
    if (robotOK) { robotWarned = false; if (announce) addSys('🤖 장비로 목소리를 보내요. 이 화면은 글자만 보여줘요.'); }
    else if (announce || (!robotWarned && why)) { robotWarned = true; addSys(why + ' 이 화면에서 읽어요. 장비에게 말을 한 번 걸면 연결돼요.'); }
  }
  function robotActive() {
    if (rTurn) return !rTurn.failed;
    if (!robotSpeak || spkOff || !robotOK) return false;
    rTurn = { tid: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), buf: '', sent: false, failed: false, chain: Promise.resolve(), muted: 0 };
    return true;
  }
  function robotSend(r, text, final) {
    r.sent = true;
    r.chain = r.chain.then(async () => {
      if (r.failed) return;
      let why = '';
      try {
        const ctl = new AbortController(), tm = setTimeout(() => { try { ctl.abort(); } catch (_) {} }, 8000);
        try {
          const res = await fetch('/xiaozhi/say', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ tid: r.tid, text, final }), signal: ctl.signal });
          if (res.ok) return;
          why = res.status === 409 ? '다른 대답을 하는 중' : res.status === 404 ? '연결이 끊김' : 'HTTP ' + res.status;
        } finally { clearTimeout(tm); }
      } catch (_) { why = '네트워크 오류'; }
      r.failed = true; robotOK = false;
      addSys('장비가 대답을 받지 못했어요 (' + why + '). 이후는 이 화면에서 읽어요.', true);
    });
  }
  function robotText(text) {
    if (!robotActive()) return;
    rTurn.buf += text;
    if (rTurn.buf.length >= 40) { const t = rTurn.buf; rTurn.buf = ''; robotSend(rTurn, t, false); }   // 40자쯤 모이면 먼저 보낸다
  }
  function robotEnd() {
    const r = rTurn; rTurn = null; if (!r || r.failed) return;
    if (r.buf.trim() || r.sent) { const t = r.buf; r.buf = ''; robotSend(r, t, true); }
    else if (r.muted) addSys('대답 자막이 오지 않아서 장비로 못 보냈어요. 서버에서 출력 자막(outputAudioTranscription)을 켜야 해요.', true);
  }

  // ----- WebSocket -----
  function wsSend(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
  function wsUrl() {
    if (Q.get('ws')) return Q.get('ws');
    if (DIRECT_KEY) return GEMINI_WS + '?key=' + encodeURIComponent(DIRECT_KEY);
    return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/live' + (authToken ? '?token=' + encodeURIComponent(authToken) : '');
  }
  async function connect() {
    if (state !== 'idle') return;
    state = 'connecting'; ready = false; updateStatus(); ensureOut();
    if (micOn) { try { await startMic(); } catch (e) { micOn = false; applyIcons(); addSys('마이크를 켤 수 없어서 글자로만 대화해요: ' + (e && e.message ? e.message : e), true); } }
    let sock;
    try { sock = new WebSocket(wsUrl()); } catch (e) { addSys('연결 주소가 올바르지 않아요: ' + e.message, true); stopMic(); state = 'idle'; updateStatus(); return; }
    ws = sock;
    const timer = setTimeout(() => { if (!ready && ws === sock) { addSys('연결이 너무 오래 걸려서 멈췄어요. 서버 주소(/api/live)를 확인해주세요.', true); disconnect(true); } }, 15000);
    sock.onopen = () => {
      if (DIRECT_KEY) {   // 서버를 거치지 않는 직접 연결일 때만 여기서 세션 설정을 보낸다 (서버가 중계하면 서버가 설정함)
        wsSend({ setup: { model: DIRECT_MODEL, generationConfig: { responseModalities: ['AUDIO'] }, inputAudioTranscription: {}, outputAudioTranscription: {},
          systemInstruction: { parts: [{ text: '당신은 ' + personaName + '입니다. 연남동 작은 타로샵의 주인이고, 다정하고 차분한 말투로 한국어로 짧게 대화하세요.' }] } } });
      }
    };
    sock.onmessage = async (ev) => {
      let m; try { m = JSON.parse(typeof ev.data === 'string' ? ev.data : await ev.data.text()); } catch (_) { return; }
      if (m.setupComplete !== undefined || m.ready) { clearTimeout(timer); ready = true; state = 'live'; endTurn(); addSys('연결됐어요. 글로 말을 걸어보세요.'); updateStatus(); refreshRobot(true); txt.focus(); return; }
      if (m.error) { addSys('오류: ' + (m.error.message || m.error), true); return; }
      const sc = m.serverContent; if (!sc) return;
      if (!ready) { clearTimeout(timer); ready = true; state = 'live'; updateStatus(); }   // setupComplete 없이 바로 시작하는 서버도 허용
      if (sc.interrupted) { stopPlayback(); robotEnd(); curAi = null; }
      if (sc.inputTranscription && sc.inputTranscription.text) feed('user', sc.inputTranscription.text);
      if (sc.outputTranscription && sc.outputTranscription.text) { feed('ai', sc.outputTranscription.text); robotText(sc.outputTranscription.text); }
      if (sc.modelTurn && sc.modelTurn.parts) for (const p of sc.modelTurn.parts) if (p.inlineData && p.inlineData.data) { if (robotActive()) rTurn.muted++; else playPcm(b64ToInt16(p.inlineData.data)); }
      if (sc.turnComplete) { robotEnd(); endTurn(); refreshRobot(false); }
    };
    sock.onerror = () => {};
    sock.onclose = (ev) => {
      clearTimeout(timer); if (ws !== sock) return;
      const was = state; ws = null; stopMic(); stopPlayback(); endTurn(); state = 'idle'; ready = false; updateStatus();
      if (ev.code === 1008 || ev.code === 4401) requireLogin('로그인이 만료됐어요. 다시 로그인해주세요.');
      else if (was !== 'idle' && !manualClose) addSys('연결이 끊어졌어요' + (ev.reason ? ' (' + ev.reason + ')' : '') + '. 오브를 눌러 다시 연결하세요.', true);
      manualClose = false; releaseWake();
    };
    requestWake();
  }
  let manualClose = false;
  function disconnect(quiet) {
    manualClose = !!quiet || true;
    if (ws) { try { ws.close(1000); } catch (_) {} ws = null; }
    stopMic(); stopPlayback(); robotEnd(); endTurn(); state = 'idle'; ready = false; releaseWake(); updateStatus();
    if (!quiet) addSys('연결을 끊었어요.');
  }

  // 화면이 꺼지지 않게 (통화 중 화면 잠김 방지)
  let wake = null;
  async function requestWake() { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (_) {} }
  function releaseWake() { try { if (wake) wake.release(); } catch (_) {} wake = null; }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && state === 'live' && !wake) requestWake(); });

  // ----- 글자 보내기 / 안부 -----
  function sendText(text) {
    text = (text || '').trim(); if (!text || state !== 'live' || !ready) return;
    stopPlayback(); robotEnd(); endTurn();
    const b = addBubble('user'); b.classList.remove('interim'); b.textContent = text; scrollDown();
    wsSend({ realtimeInput: { text } });
  }
  sendBtn.addEventListener('click', () => { const t = txt.value; txt.value = ''; sendText(t); });
  txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendBtn.click(); } });
  helloBtn.addEventListener('click', () => sendText('뭐해?'));

  micBtn.addEventListener('click', async () => {
    micOn = !micOn; applyIcons();
    if (state === 'live') {
      if (micOn && !mic) { try { await startMic(); } catch (e) { micOn = false; applyIcons(); addSys('마이크를 켤 수 없어요: ' + (e && e.message ? e.message : e), true); } }
      else if (!micOn) stopMic();
    }
    updateStatus();
  });
  spkBtn.addEventListener('click', () => {
    spkOff = !spkOff; try { localStorage.setItem(SPK_KEY, spkOff ? '1' : '0'); } catch (_) {}
    if (outGain) outGain.gain.value = spkOff ? 0 : 1; applyIcons(); if (state === 'live') refreshRobot(false);
  });
  $('robotBtn').addEventListener('click', () => {
    robotSpeak = !robotSpeak; try { localStorage.setItem('robotSpeak', robotSpeak ? '1' : '0'); } catch (_) {}
    applyIcons(); if (state === 'live') refreshRobot(true); else robotOK = false;
  });
  orb.addEventListener('click', () => { if (state === 'idle') connect(); else disconnect(false); });

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true; startBtn.textContent = '확인 중…'; ensureOut();
    try {
      if (!DIRECT_KEY && authToken) {   // 토큰이 아직 유효한지 가볍게 확인
        const r = await fetch('/api/config', { headers: authHeaders() }); if (r.status === 401) { requireLogin('로그인이 필요해요.'); return; }
      }
      sessionOpen = true; setup.classList.add('hidden'); updateStatus();
      addSys('아래 오브를 누르면 ' + personaName + '과 실시간 통화가 시작돼요.');
    } catch (e) { startBtn.disabled = false; startBtn.textContent = '다시 시도'; setupWarn.style.display = 'block'; setupWarn.textContent = '연결하지 못했어요: ' + (e && e.message ? e.message : e); }
  });
  window.addEventListener('pagehide', () => { if (ws) { manualClose = true; try { ws.close(1000); } catch (_) {} } });

  applyPersona('', ''); applyIcons(); updateStatus(); init();
})();
</script>
</body>
</html>
